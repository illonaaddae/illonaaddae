<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">My AI and Machine Learning journey</title>
  <desc id="d">A friendly robot waves hello next to a small neural network with signals flowing through it. Below, the path: Python, Data Engineering, Data Science, Machine Learning, Applied AI, Robotics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03121c"/>
      <stop offset="1" stop-color="#0b3a4f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0c3446"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff"/></pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>

  <style>
    .fb { transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 4s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .wave { transform-origin: 293px 192px; animation: wave 1.6s ease-in-out infinite; }
    .beacon { animation: beacon 1.8s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar 1.1s ease-in-out infinite; }
    .bar:nth-of-type(2) { animation-delay: -0.2s; }
    .bar:nth-of-type(3) { animation-delay: -0.5s; }
    .bar:nth-of-type(4) { animation-delay: -0.8s; }
    .bar:nth-of-type(5) { animation-delay: -0.35s; }
    .dot { animation: dot 1.2s ease-in-out infinite; }
    .d2 { animation-delay: 0.2s; } .d3 { animation-delay: 0.4s; }
    .sig { stroke-dasharray: 10 90; animation: sig 2.4s linear infinite; }
    .s2 { animation-delay: -0.6s; } .s3 { animation-delay: -1.2s; } .s4 { animation-delay: -1.8s; }
    .node { animation: node 2.4s ease-in-out infinite; }
    .l2 { animation-delay: 0.6s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.8s; }
    .chip { animation: chip 12s ease-in-out infinite; }
    .c2 { animation-delay: 2s; } .c3 { animation-delay: 4s; } .c4 { animation-delay: 6s; } .c5 { animation-delay: 8s; } .c6 { animation-delay: 10s; }
    .blobA { animation: driftA 16s ease-in-out infinite alternate; }
    .blobB { animation: driftB 20s ease-in-out infinite alternate; }
    @keyframes float { 50% { transform: translateY(-12px); } }
    @keyframes shadow { 50% { transform: scaleX(0.8); opacity: 0.5; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes wave { 0%, 100% { transform: rotate(-150deg); } 50% { transform: rotate(-115deg); } }
    @keyframes beacon { 50% { opacity: 0.35; } }
    @keyframes bar { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    @keyframes dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes sig { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes node { 0%, 100% { fill-opacity: 0.15; } 40% { fill-opacity: 1; } }
    @keyframes chip { 0%, 18%, 100% { stroke-opacity: 0.2; fill-opacity: 0.05; } 3%, 15% { stroke-opacity: 1; fill-opacity: 0.18; } }
    @keyframes driftA { to { transform: translate(120px, 30px); } }
    @keyframes driftB { to { transform: translate(-140px, -20px); } }
    @media (prefers-reduced-motion: reduce) {
      .float, .shadow, .blink, .wave, .beacon, .bar, .dot, .sig, .node, .chip, .blobA, .blobB { animation: none; }
      .wave { transform: rotate(-140deg); }
    }
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="blobA" cx="220" cy="120" r="140" fill="#0891b2" opacity="0.45"/>
      <circle class="blobB" cx="900" cy="300" r="160" fill="#6366f1" opacity="0.3"/>
    </g>
    <rect width="1200" height="380" fill="url(#dots)" opacity="0.06"/>

    <!-- robot -->
    <ellipse class="shadow" cx="230" cy="300" rx="62" ry="9" fill="#000000" opacity="0.35"/>
    <g class="float">
      <g transform="translate(150 40)">
        <!-- antenna -->
        <line x1="80" y1="34" x2="80" y2="12" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
        <circle cx="80" cy="9" r="18" fill="url(#glow)" class="beacon"/>
        <circle cx="80" cy="9" r="7" fill="#67e8f9"/>
        <!-- ears -->
        <rect x="8" y="64" width="14" height="30" rx="6" fill="#0e7490"/>
        <rect x="138" y="64" width="14" height="30" rx="6" fill="#0e7490"/>
        <!-- head -->
        <rect x="18" y="32" width="124" height="94" rx="28" fill="url(#metal)" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2"/>
        <rect x="32" y="50" width="96" height="54" rx="18" fill="#03121c"/>
        <ellipse class="blink" cx="62" cy="74" rx="9" ry="11" fill="#67e8f9"/>
        <ellipse class="blink" cx="98" cy="74" rx="9" ry="11" fill="#67e8f9"/>
        <path d="M68 92 Q80 100 92 92" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
        <!-- neck -->
        <rect x="66" y="126" width="28" height="10" rx="3" fill="#0e7490"/>
        <!-- left arm -->
        <rect x="6" y="146" width="20" height="66" rx="10" fill="#0e7490"/>
        <circle cx="16" cy="216" r="11" fill="#155e75" stroke="#67e8f9" stroke-opacity="0.5"/>
        <!-- body -->
        <rect x="28" y="136" width="104" height="100" rx="24" fill="url(#metal)" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2"/>
        <rect x="48" y="154" width="64" height="44" rx="10" fill="#03121c"/>
        <g fill="#67e8f9">
          <rect class="bar" x="56" y="164" width="6" height="26" rx="3"/>
          <rect class="bar" x="66" y="164" width="6" height="26" rx="3"/>
          <rect class="bar" x="76" y="164" width="6" height="26" rx="3"/>
          <rect class="bar" x="86" y="164" width="6" height="26" rx="3"/>
          <rect class="bar" x="96" y="164" width="6" height="26" rx="3"/>
        </g>
        <circle cx="60" cy="216" r="5" fill="#a5b4fc"/>
        <circle cx="80" cy="216" r="5" fill="#67e8f9"/>
        <circle cx="100" cy="216" r="5" fill="#34d399"/>
      </g>
      <!-- waving arm, pivots at the right shoulder -->
      <g class="wave">
        <rect x="283" y="192" width="20" height="66" rx="10" fill="#0e7490"/>
        <circle cx="293" cy="262" r="11" fill="#155e75" stroke="#67e8f9" stroke-opacity="0.5"/>
      </g>
    </g>

    <!-- speech bubble -->
    <g transform="translate(350 70)">
      <rect width="230" height="48" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#67e8f9" stroke-opacity="0.35"/>
      <path d="M0 30 L-14 40 L6 38 Z" fill="#ffffff" fill-opacity="0.08"/>
      <text x="18" y="30" class="mono" font-size="17" fill="#e6f0fa">print("Hello, AI")</text>
    </g>
    <g transform="translate(350 132)">
      <rect width="150" height="34" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <text x="16" y="22" class="sans" font-size="14" fill="#9cc9ef">learning</text>
      <circle class="dot" cx="92" cy="17" r="3.5" fill="#67e8f9"/>
      <circle class="dot d2" cx="104" cy="17" r="3.5" fill="#67e8f9"/>
      <circle class="dot d3" cx="116" cy="17" r="3.5" fill="#67e8f9"/>
    </g>

    <!-- title -->
    <text x="660" y="62" class="sans" font-size="28" font-weight="700" fill="url(#title)">AI &amp; Machine Learning</text>
    <text x="660" y="90" class="sans" font-size="16" fill="#9cc9ef">the next chapter I'm building towards</text>

    <!-- network: base edges -->
    <g stroke="#67e8f9" stroke-opacity="0.15" stroke-width="1.5">
      <line x1="700" y1="140" x2="840" y2="125"/><line x1="700" y1="140" x2="840" y2="180"/><line x1="700" y1="140" x2="840" y2="235"/>
      <line x1="700" y1="200" x2="840" y2="125"/><line x1="700" y1="200" x2="840" y2="180"/><line x1="700" y1="200" x2="840" y2="235"/>
      <line x1="700" y1="260" x2="840" y2="125"/><line x1="700" y1="260" x2="840" y2="180"/><line x1="700" y1="260" x2="840" y2="235"/>
      <line x1="840" y1="125" x2="980" y2="155"/><line x1="840" y1="125" x2="980" y2="225"/>
      <line x1="840" y1="180" x2="980" y2="155"/><line x1="840" y1="180" x2="980" y2="225"/>
      <line x1="840" y1="235" x2="980" y2="155"/><line x1="840" y1="235" x2="980" y2="225"/>
      <line x1="980" y1="155" x2="1110" y2="190"/><line x1="980" y1="225" x2="1110" y2="190"/>
    </g>
    <!-- network: moving signals -->
    <g stroke="#67e8f9" stroke-width="3" stroke-linecap="round" fill="none">
      <line class="sig" pathLength="100" x1="700" y1="140" x2="840" y2="180"/>
      <line class="sig s2" pathLength="100" x1="700" y1="260" x2="840" y2="125"/>
      <line class="sig s3" pathLength="100" x1="700" y1="200" x2="840" y2="235"/>
      <line class="sig s2" pathLength="100" x1="840" y1="125" x2="980" y2="225"/>
      <line class="sig s4" pathLength="100" x1="840" y1="180" x2="980" y2="155"/>
      <line class="sig s3" pathLength="100" x1="840" y1="235" x2="980" y2="155"/>
      <line class="sig s4" pathLength="100" x1="980" y1="155" x2="1110" y2="190"/>
      <line class="sig" pathLength="100" x1="980" y1="225" x2="1110" y2="190"/>
    </g>
    <!-- network: nodes -->
    <g stroke="#67e8f9" stroke-width="2" fill="#67e8f9">
      <circle class="node" cx="700" cy="140" r="10"/><circle class="node" cx="700" cy="200" r="10"/><circle class="node" cx="700" cy="260" r="10"/>
      <circle class="node l2" cx="840" cy="125" r="10"/><circle class="node l2" cx="840" cy="180" r="10"/><circle class="node l2" cx="840" cy="235" r="10"/>
      <circle class="node l3" cx="980" cy="155" r="10"/><circle class="node l3" cx="980" cy="225" r="10"/>
      <circle class="node l4" cx="1110" cy="190" r="14"/>
    </g>

    <!-- path chips -->
    <g class="sans" font-size="15" text-anchor="middle">
      <rect class="chip" x="120" y="318" width="90" height="36" rx="18" fill="#67e8f9" fill-opacity="0.05" stroke="#67e8f9" stroke-opacity="0.2"/>
      <text x="165" y="341" fill="#e6f0fa">Python</text>
      <text x="228" y="341" fill="#67e8f9">→</text>
      <rect class="chip c2" x="246" y="318" width="170" height="36" rx="18" fill="#67e8f9" fill-opacity="0.05" stroke="#67e8f9" stroke-opacity="0.2"/>
      <text x="331" y="341" fill="#e6f0fa">Data Engineering</text>
      <text x="434" y="341" fill="#67e8f9">→</text>
      <rect class="chip c3" x="452" y="318" width="130" height="36" rx="18" fill="#67e8f9" fill-opacity="0.05" stroke="#67e8f9" stroke-opacity="0.2"/>
      <text x="517" y="341" fill="#e6f0fa">Data Science</text>
      <text x="600" y="341" fill="#67e8f9">→</text>
      <rect class="chip c4" x="618" y="318" width="170" height="36" rx="18" fill="#67e8f9" fill-opacity="0.05" stroke="#67e8f9" stroke-opacity="0.2"/>
      <text x="703" y="341" fill="#e6f0fa">Machine Learning</text>
      <text x="806" y="341" fill="#67e8f9">→</text>
      <rect class="chip c5" x="824" y="318" width="120" height="36" rx="18" fill="#67e8f9" fill-opacity="0.05" stroke="#67e8f9" stroke-opacity="0.2"/>
      <text x="884" y="341" fill="#e6f0fa">Applied AI</text>
      <text x="962" y="341" fill="#67e8f9">→</text>
      <rect class="chip c6" x="980" y="318" width="100" height="36" rx="18" fill="#67e8f9" fill-opacity="0.05" stroke="#67e8f9" stroke-opacity="0.2"/>
      <text x="1030" y="341" fill="#e6f0fa">Robotics</text>
    </g>
  </g>
</svg>
